name: 5OC Upload Checkpoint

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  upload-checkpoint:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    env:
      PROJECT_ID: GI-WEBSITE-INTEGRATED-TEST-003
      EXPECTED_RUN_ID: "3"
      DIFY_USER: github-5oc-worker
      STORAGE_BUCKET: five-oc-inputs

    steps:
      - name: Upload resume to Dify and persist checkpoint
        env:
          DIFY_5OC_API_KEY: ${{ secrets.DIFY_5OC_API_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
        run: |
          set -euo pipefail

          python3 - <<'PY'
          import json
          import mimetypes
          import os
          import uuid
          import urllib.error
          import urllib.parse
          import urllib.request
          from datetime import datetime, timezone


          PROJECT_ID = os.environ["PROJECT_ID"]
          EXPECTED_RUN_ID = int(os.environ["EXPECTED_RUN_ID"])
          DIFY_USER = os.environ["DIFY_USER"]
          STORAGE_BUCKET = os.environ["STORAGE_BUCKET"]

          SUPABASE_URL = os.environ["SUPABASE_URL"].rstrip("/")
          SUPABASE_KEY = os.environ["SUPABASE_SECRET_KEY"]
          DIFY_KEY = os.environ["DIFY_5OC_API_KEY"]

          USER_AGENT = "Grant-Intelligence-5OC-Diagnostic/1.0"


          def sb_headers(extra=None):
              headers = {
                  "apikey": SUPABASE_KEY,
                  "Authorization": f"Bearer {SUPABASE_KEY}",
                  "Accept": "application/json",
              }
              if extra:
                  headers.update(extra)
              return headers


          def get_run():
              query = urllib.parse.urlencode({
                  "project_id": f"eq.{PROJECT_ID}",
                  "select": (
                      "id,project_id,status,resume_storage_path,"
                      "inputs_json,dify_resume_upload_id,dify_user,"
                      "workflow_run_id,task_id,launch_attempted_at,"
                      "updated_at"
                  ),
              })

              url = (
                  f"{SUPABASE_URL}/rest/v1/five_oc_runs?"
                  f"{query}"
              )

              req = urllib.request.Request(
                  url,
                  headers=sb_headers(),
                  method="GET",
              )

              with urllib.request.urlopen(
                  req, timeout=30
              ) as response:
                  return json.loads(
                      response.read().decode("utf-8")
                  )


          def download_resume(storage_path):
              encoded_path = urllib.parse.quote(
                  storage_path,
                  safe="/",
              )

              url = (
                  f"{SUPABASE_URL}/storage/v1/object/"
                  f"authenticated/{STORAGE_BUCKET}/"
                  f"{encoded_path}"
              )

              req = urllib.request.Request(
                  url,
                  headers={
                      "apikey": SUPABASE_KEY,
                      "Authorization":
                          f"Bearer {SUPABASE_KEY}",
                  },
                  method="GET",
              )

              with urllib.request.urlopen(
                  req, timeout=60
              ) as response:
                  return response.read()


          def multipart_body(
              file_bytes,
              filename,
              content_type,
          ):
              boundary = (
                  "----5OCBoundary"
                  + uuid.uuid4().hex
              )

              chunks = []

              def add_text(name, value):
                  chunks.append(
                      f"--{boundary}\r\n".encode()
                  )
                  chunks.append(
                      (
                          f'Content-Disposition: form-data; '
                          f'name="{name}"\r\n\r\n'
                      ).encode()
                  )
                  chunks.append(str(value).encode())
                  chunks.append(b"\r\n")

              add_text("user", DIFY_USER)

              chunks.append(
                  f"--{boundary}\r\n".encode()
              )
              chunks.append(
                  (
                      "Content-Disposition: form-data; "
                      f'name="file"; '
                      f'filename="{filename}"\r\n'
                  ).encode()
              )
              chunks.append(
                  (
                      f"Content-Type: {content_type}\r\n\r\n"
                  ).encode()
              )
              chunks.append(file_bytes)
              chunks.append(b"\r\n")
              chunks.append(
                  f"--{boundary}--\r\n".encode()
              )

              return boundary, b"".join(chunks)


          def upload_to_dify(
              file_bytes,
              filename,
              content_type,
          ):
              boundary, body = multipart_body(
                  file_bytes,
                  filename,
                  content_type,
              )

              req = urllib.request.Request(
                  "https://api.dify.ai/v1/files/upload",
                  data=body,
                  headers={
                      "Authorization":
                          f"Bearer {DIFY_KEY}",
                      "User-Agent": USER_AGENT,
                      "Content-Type":
                          f"multipart/form-data; "
                          f"boundary={boundary}",
                      "Accept": "application/json",
                  },
                  method="POST",
              )

              try:
                  with urllib.request.urlopen(
                      req, timeout=120
                  ) as response:
                      status = response.status
                      raw = response.read().decode(
                          "utf-8"
                      )
              except urllib.error.HTTPError as exc:
                  raw = exc.read().decode(
                      "utf-8",
                      errors="replace",
                  )
                  raise SystemExit(
                      "Dify résumé upload failed. "
                      f"HTTP {exc.code}\n{raw}"
                  )

              print(
                  f"Dify upload HTTP status: {status}"
              )

              if status not in (200, 201):
                  raise SystemExit(
                      "Unexpected Dify upload status: "
                      f"{status}"
                  )

              result = json.loads(raw)
              upload_id = result.get("id")

              if not upload_id:
                  raise SystemExit(
                      "Dify returned no résumé upload ID."
                  )

              return upload_id


          def persist_upload(run_id, upload_id):
              query = urllib.parse.urlencode({
                  "id": f"eq.{run_id}",
                  "project_id": f"eq.{PROJECT_ID}",
                  "status": "eq.created",
                  "dify_resume_upload_id": "is.null",
                  "launch_attempted_at": "is.null",
                  "workflow_run_id": "is.null",
                  "task_id": "is.null",
              })

              url = (
                  f"{SUPABASE_URL}/rest/v1/"
                  f"five_oc_runs?{query}"
              )

              payload = {
                  "dify_resume_upload_id": upload_id,
                  "dify_user": DIFY_USER,
                  "updated_at":
                      datetime.now(
                          timezone.utc
                      ).isoformat(),
              }

              req = urllib.request.Request(
                  url,
                  data=json.dumps(payload).encode(
                      "utf-8"
                  ),
                  headers=sb_headers({
                      "Content-Type":
                          "application/json",
                      "Prefer":
                          "return=representation",
                  }),
                  method="PATCH",
              )

              with urllib.request.urlopen(
                  req, timeout=30
              ) as response:
                  return json.loads(
                      response.read().decode("utf-8")
                  )


          # -------------------------------------------
          # 1. Validate the untouched durable record
          # -------------------------------------------

          rows = get_run()

          if not isinstance(rows, list) or len(rows) != 1:
              raise SystemExit(
                  "SAFETY STOP: expected exactly one "
                  "durable run record."
              )

          row = rows[0]

          if row.get("id") != EXPECTED_RUN_ID:
              raise SystemExit(
                  "SAFETY STOP: expected Record "
                  f"{EXPECTED_RUN_ID}; received "
                  f"{row.get('id')}."
              )

          if row.get("project_id") != PROJECT_ID:
              raise SystemExit(
                  "SAFETY STOP: project_id mismatch."
              )

          if row.get("status") != "created":
              raise SystemExit(
                  "SAFETY STOP: status must be created; "
                  f"received {row.get('status')}."
              )

          if row.get("workflow_run_id") is not None:
              raise SystemExit(
                  "SAFETY STOP: workflow_run_id "
                  "already exists."
              )

          if row.get("task_id") is not None:
              raise SystemExit(
                  "SAFETY STOP: task_id already exists."
              )

          if row.get("launch_attempted_at") is not None:
              raise SystemExit(
                  "SAFETY STOP: launch_attempted_at "
                  "already exists."
              )

          if row.get(
              "dify_resume_upload_id"
          ) is not None:
              raise SystemExit(
                  "SAFETY STOP: Dify résumé upload "
                  "already exists. Do not duplicate it."
              )

          if row.get("dify_user") is not None:
              raise SystemExit(
                  "SAFETY STOP: dify_user already "
                  "exists before checkpoint."
              )

          inputs = row.get("inputs_json") or {}
          resume = inputs.get("resume") or {}

          if inputs.get("project_id") != PROJECT_ID:
              raise SystemExit(
                  "SAFETY STOP: inputs_json "
                  "project_id mismatch."
              )

          if inputs.get(
              "source_mode"
          ) != "standalone_upload":
              raise SystemExit(
                  "SAFETY STOP: unexpected "
                  "source_mode."
              )

          storage_path = row.get(
              "resume_storage_path"
          )

          expected_size = resume.get("size")
          original_name = resume.get(
              "original_name"
          )
          content_type = resume.get(
              "content_type"
          )

          if not storage_path:
              raise SystemExit(
                  "SAFETY STOP: résumé storage path "
                  "is missing."
              )

          if (
              not isinstance(expected_size, int)
              or expected_size <= 0
          ):
              raise SystemExit(
                  "SAFETY STOP: invalid résumé "
                  "size metadata."
              )

          if expected_size != 48640:
              raise SystemExit(
                  "SAFETY STOP: Record 3 résumé "
                  "size is not the expected 48640 bytes."
              )

          if original_name != (
              "TEST - Ginger 9a convert - Resume.doc"
          ):
              raise SystemExit(
                  "SAFETY STOP: unexpected résumé "
                  "filename."
              )

          if content_type != "application/msword":
              raise SystemExit(
                  "SAFETY STOP: unexpected résumé "
                  "content type."
              )

          print(
              "Durable record validation: PASSED"
          )
          print(f"Record ID: {row['id']}")
          print(f"Project ID: {PROJECT_ID}")
          print("Existing Dify upload: NONE")
          print("Workflow execution: NOT STARTED")


          # -------------------------------------------
          # 2. Retrieve private résumé from Supabase
          # -------------------------------------------

          resume_bytes = download_resume(
              storage_path
          )

          actual_size = len(resume_bytes)

          print(
              f"Expected résumé bytes: {expected_size}"
          )
          print(
              f"Downloaded résumé bytes: {actual_size}"
          )

          if actual_size != expected_size:
              raise SystemExit(
                  "SAFETY STOP: résumé integrity "
                  "check failed."
              )

          print(
              "Private résumé retrieval: PASSED"
          )
          print("Résumé integrity: PASSED")


          # -------------------------------------------
          # 3. Upload ONLY the résumé to Dify
          # -------------------------------------------

          if not content_type:
              content_type = (
                  mimetypes.guess_type(
                      original_name
                  )[0]
                  or "application/octet-stream"
              )

          upload_id = upload_to_dify(
              resume_bytes,
              original_name,
              content_type,
          )

          print("Dify résumé upload: PASSED")


          # -------------------------------------------
          # 4. Persist upload ID into Record 3
          # -------------------------------------------

          updated = persist_upload(
              row["id"],
              upload_id,
          )

          if (
              not isinstance(updated, list)
              or len(updated) != 1
          ):
              raise SystemExit(
                  "SAFETY STOP: Dify file upload "
                  "succeeded, but durable persistence "
                  "did not update exactly one untouched "
                  "record. DO NOT run 5OC."
              )

          saved = updated[0]

          if (
              saved.get("dify_resume_upload_id")
              != upload_id
          ):
              raise SystemExit(
                  "Persisted Dify upload ID mismatch."
              )

          if saved.get("dify_user") != DIFY_USER:
              raise SystemExit(
                  "Persisted Dify user mismatch."
              )

          if saved.get("status") != "created":
              raise SystemExit(
                  "SAFETY STOP: checkpoint changed "
                  "run status unexpectedly."
              )

          if saved.get(
              "workflow_run_id"
          ) is not None:
              raise SystemExit(
                  "SAFETY STOP: workflow_run_id "
                  "was unexpectedly populated."
              )

          if saved.get("task_id") is not None:
              raise SystemExit(
                  "SAFETY STOP: task_id was "
                  "unexpectedly populated."
              )

          if saved.get(
              "launch_attempted_at"
          ) is not None:
              raise SystemExit(
                  "SAFETY STOP: launch_attempted_at "
                  "was unexpectedly populated."
              )


          # -------------------------------------------
          # Final checkpoint
          # -------------------------------------------

          print("========================================")
          print("5OC UPLOAD CHECKPOINT: PASSED")
          print("========================================")
          print(f"Record ID: {saved['id']}")
          print("Private résumé retrieval: PASSED")
          print("Résumé integrity: PASSED")
          print("Dify résumé upload: PASSED")
          print("Dify upload ID persisted: PASSED")
          print("Dify user persisted: PASSED")
          print("Run status remains: created")
          print("launch_attempted_at: NULL")
          print("workflow_run_id: NULL")
          print("task_id: NULL")
          print("/workflows/run called: NO")
          print("5OC workflow execution: NOT STARTED")
          print("========================================")
          PY
