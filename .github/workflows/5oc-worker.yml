name: 5OC Cloudflare Diagnostic

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose-dify-access:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Test Dify API boundary without running 5OC
        env:
          DIFY_5OC_API_KEY: ${{ secrets.DIFY_5OC_API_KEY }}
        run: |
          python3 - <<'PY'
          import os
          import urllib.request
          import urllib.error

          API_KEY = os.environ["DIFY_5OC_API_KEY"]

          if not API_KEY:
              raise RuntimeError("DIFY_5OC_API_KEY is missing.")

          BASE = "https://api.dify.ai/v1"

          print("========================================")
          print("5OC ZERO-CREDIT CLOUDFLARE DIAGNOSTIC")
          print("========================================")
          print("POST /workflows/run: DISABLED")
          print("Workflow execution: DISABLED")
          print("Supabase writes: DISABLED")
          print("Dify file upload: DISABLED")
          print("----------------------------------------")

          def probe(name, url, method="GET", authenticated=False):
              headers = {
                  "Accept": "application/json",
                  "User-Agent": "Grant-Intelligence-5OC-Diagnostic/1.0",
              }

              if authenticated:
                  headers["Authorization"] = f"Bearer {API_KEY}"

              request = urllib.request.Request(
                  url,
                  headers=headers,
                  method=method,
              )

              print()
              print(f"TEST: {name}")
              print(f"METHOD: {method}")
              print(f"URL PATH: {url.replace(BASE, '')}")

              try:
                  with urllib.request.urlopen(
                      request,
                      timeout=30
                  ) as response:
                      body = response.read(1000).decode(
                          "utf-8",
                          errors="replace"
                      )

                      print(f"HTTP STATUS: {response.status}")
                      print(
                          "CONTENT-TYPE:",
                          response.headers.get(
                              "Content-Type",
                              "unknown"
                          )
                      )

                      server = response.headers.get(
                          "Server",
                          "unknown"
                      )
                      print(f"SERVER: {server}")

                      cf_ray = response.headers.get("CF-RAY")
                      if cf_ray:
                          print(f"CF-RAY: {cf_ray}")

                      print(
                          "BODY PREVIEW:",
                          body[:500].replace("\n", " ")
                      )

              except urllib.error.HTTPError as e:
                  body = e.read(1000).decode(
                      "utf-8",
                      errors="replace"
                  )

                  print(f"HTTP STATUS: {e.code}")
                  print(
                      "CONTENT-TYPE:",
                      e.headers.get(
                          "Content-Type",
                          "unknown"
                      )
                  )

                  server = e.headers.get(
                      "Server",
                      "unknown"
                  )
                  print(f"SERVER: {server}")

                  cf_ray = e.headers.get("CF-RAY")
                  if cf_ray:
                      print(f"CF-RAY: {cf_ray}")

                  if (
                      "cloudflare" in body.lower()
                      or "access denied" in body.lower()
                  ):
                      print(
                          "CLOUDFLARE ACCESS PAGE: YES"
                      )
                  else:
                      print(
                          "CLOUDFLARE ACCESS PAGE: NO/"
                          "NOT DETECTED"
                      )

                  print(
                      "BODY PREVIEW:",
                      body[:500].replace("\n", " ")
                  )

              except Exception as e:
                  print(
                      "CONNECTION ERROR:",
                      type(e).__name__,
                      str(e)
                  )

          # --------------------------------------------------
          # Test 1
          # Basic API-host reachability.
          # No workflow execution.
          # --------------------------------------------------

          probe(
              "API host reachability",
              f"{BASE}/",
              method="GET",
              authenticated=False,
          )

          # --------------------------------------------------
          # Test 2
          # Authenticated read-only API request.
          # This does NOT execute a workflow.
          # --------------------------------------------------

          probe(
              "Authenticated workflow parameters read",
              f"{BASE}/parameters",
              method="GET",
              authenticated=True,
          )

          # --------------------------------------------------
          # Test 3
          # OPTIONS against the run endpoint.
          #
          # IMPORTANT:
          # This is NOT POST.
          # It contains no workflow inputs.
          # It cannot intentionally start 5OC.
          # --------------------------------------------------

          probe(
              "Workflow run endpoint OPTIONS probe",
              f"{BASE}/workflows/run",
              method="OPTIONS",
              authenticated=True,
          )

          print()
          print("========================================")
          print("DIAGNOSTIC COMPLETE")
          print("========================================")
          print("POST /workflows/run called: NO")
          print("5OC workflow started: NO")
          print("Supabase record 2 modified: NO")
          print("Expected Dify LLM credits used: 0")
          print("========================================")
          PY
