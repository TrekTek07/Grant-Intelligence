name: 5OC Published Input Schema Diagnostic

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect-published-schema:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Inspect published Dify Main input schema
        env:
          DIFY_5OC_API_KEY: ${{ secrets.DIFY_5OC_API_KEY }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import sys
          import urllib.request
          import urllib.error

          API_KEY = os.environ.get("DIFY_5OC_API_KEY", "")
          BASE = "https://api.dify.ai/v1"
          PARAMETERS_URL = f"{BASE}/parameters"

          EXPECTED_VARIABLES = [
              "project_id",
              "access_mode",
              "source_mode",
              "standalone_resume_text",
              "standalone_resume_file",
              "standalone_document_text",
              "standalone_document_file",
              "standalone_intake_notes",
              "module00_source_data",
              "module01_source_data",
          ]

          if not API_KEY:
              raise RuntimeError(
                  "DIFY_5OC_API_KEY is missing."
              )

          print("========================================")
          print("5OC PUBLISHED INPUT SCHEMA DIAGNOSTIC")
          print("========================================")
          print("GET /parameters: ENABLED")
          print("POST /workflows/run: DISABLED")
          print("Workflow execution: DISABLED")
          print("Supabase writes: DISABLED")
          print("Dify file upload: DISABLED")
          print("----------------------------------------")

          request = urllib.request.Request(
              PARAMETERS_URL,
              headers={
                  "Authorization": f"Bearer {API_KEY}",
                  "Accept": "application/json",
                  "User-Agent":
                      "Grant-Intelligence-5OC-Schema-Diagnostic/1.0",
              },
              method="GET",
          )

          try:
              with urllib.request.urlopen(
                  request,
                  timeout=30
              ) as response:
                  raw = response.read().decode(
                      "utf-8",
                      errors="replace"
                  )

                  print(
                      f"GET /parameters HTTP status: "
                      f"{response.status}"
                  )

                  print(
                      "Content-Type:",
                      response.headers.get(
                          "Content-Type",
                          "unknown"
                      )
                  )

                  cf_ray = response.headers.get("CF-RAY")

                  if cf_ray:
                      print(f"CF-RAY: {cf_ray}")

          except urllib.error.HTTPError as e:
              body = e.read().decode(
                  "utf-8",
                  errors="replace"
              )

              print(
                  f"GET /parameters FAILED: HTTP {e.code}"
              )

              print(body[:1500])

              sys.exit(1)

          try:
              data = json.loads(raw)
          except json.JSONDecodeError:
              print(
                  "ERROR: /parameters did not return "
                  "valid JSON."
              )
              sys.exit(1)

          forms = data.get("user_input_form")

          if not isinstance(forms, list):
              print(
                  "ERROR: user_input_form is missing "
                  "or is not a list."
              )
              sys.exit(1)

          print()
          print(
              f"Published input entries returned: "
              f"{len(forms)}"
          )
          print()

          discovered = {}

          for index, entry in enumerate(forms, start=1):

              if not isinstance(entry, dict):
                  print(
                      f"{index}. INVALID ENTRY: "
                      f"{repr(entry)}"
                  )
                  continue

              if len(entry) != 1:
                  print(
                      f"{index}. UNEXPECTED ENTRY SHAPE"
                  )
                  print(
                      json.dumps(
                          entry,
                          indent=2,
                          ensure_ascii=False
                      )
                  )
                  continue

              control_type, config = next(
                  iter(entry.items())
              )

              if not isinstance(config, dict):
                  print(
                      f"{index}. {control_type}: "
                      "invalid configuration"
                  )
                  continue

              variable = config.get("variable")
              label = config.get("label")
              required = config.get("required")
              declared_type = config.get("type")

              if variable:
                  discovered[variable] = {
                      "control_type": control_type,
                      "config": config,
                  }

              print("----------------------------------------")
              print(f"INPUT #{index}")
              print(f"Variable: {variable}")
              print(f"Label: {label}")
              print(f"Control type: {control_type}")
              print(f"Declared type: {declared_type}")
              print(f"Required: {required}")

              # File controls can expose additional fields
              # such as allowed file types, transfer methods,
              # extensions, or number limits. Print the full
              # configuration so we do not guess.
              if (
                  variable
                  in (
                      "standalone_resume_file",
                      "standalone_document_file",
                  )
                  or "file" in control_type.lower()
              ):
                  print("FULL FILE CONFIGURATION:")
                  print(
                      json.dumps(
                          config,
                          indent=2,
                          ensure_ascii=False,
                          sort_keys=True
                      )
                  )

          print()
          print("========================================")
          print("EXPECTED 5OC MAIN START VARIABLES")
          print("========================================")

          missing = []

          for variable in EXPECTED_VARIABLES:
              if variable in discovered:
                  control_type = discovered[
                      variable
                  ]["control_type"]

                  config = discovered[
                      variable
                  ]["config"]

                  print(
                      f"FOUND: {variable} "
                      f"| control={control_type} "
                      f"| required="
                      f"{config.get('required')}"
                  )
              else:
                  missing.append(variable)
                  print(f"MISSING: {variable}")

          extras = [
              variable
              for variable in discovered
              if variable not in EXPECTED_VARIABLES
          ]

          print()
          print("========================================")
          print("SCHEMA SUMMARY")
          print("========================================")
          print(
              f"Expected variables: "
              f"{len(EXPECTED_VARIABLES)}"
          )
          print(
              f"Expected variables found: "
              f"{len(EXPECTED_VARIABLES) - len(missing)}"
          )
          print(
              f"Expected variables missing: "
              f"{len(missing)}"
          )
          print(
              f"Additional published variables: "
              f"{len(extras)}"
          )

          if missing:
              print(
                  "Missing expected variables: "
                  + ", ".join(missing)
              )

          if extras:
              print(
                  "Additional variables: "
                  + ", ".join(extras)
              )

          print()
          print("FILE INPUT DETAILS")
          print("----------------------------------------")

          for variable in (
              "standalone_resume_file",
              "standalone_document_file",
          ):
              item = discovered.get(variable)

              if not item:
                  print(f"{variable}: NOT FOUND")
                  continue

              print(f"{variable}:")
              print(
                  json.dumps(
                      item,
                      indent=2,
                      ensure_ascii=False,
                      sort_keys=True
                  )
              )

          print()
          print("========================================")
          print("DIAGNOSTIC COMPLETE")
          print("========================================")
          print("POST /workflows/run called: NO")
          print("5OC workflow started: NO")
          print("Supabase modified: NO")
          print("Dify file uploaded: NO")
          print("Expected Dify LLM credits used: 0")
          print("========================================")
          PY
