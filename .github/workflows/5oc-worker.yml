name: 5OC Worker

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  run-5oc:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    env:
      PROJECT_ID: GI-WEBSITE-INTEGRATED-TEST-003
      DIFY_USER: github-5oc-worker

    steps:
      - name: Execute protected 5OC run
        env:
          DIFY_5OC_API_KEY: ${{ secrets.DIFY_5OC_API_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import sys
          import urllib.request
          import urllib.parse
          import urllib.error
          from datetime import datetime, timezone

          PROJECT_ID = os.environ["PROJECT_ID"]
          DIFY_USER = os.environ["DIFY_USER"]
          SUPABASE_URL = os.environ["SUPABASE_URL"].rstrip("/")
          SUPABASE_KEY = os.environ["SUPABASE_SECRET_KEY"]
          DIFY_KEY = os.environ["DIFY_5OC_API_KEY"]
          DIFY_RUN_URL = "https://api.dify.ai/v1/workflows/run"

          def now():
              return datetime.now(timezone.utc).isoformat()

          def sb_headers(extra=None):
              headers = {
                  "apikey": SUPABASE_KEY,
                  "Authorization": f"Bearer {SUPABASE_KEY}",
                  "Content-Type": "application/json",
              }
              if extra:
                  headers.update(extra)
              return headers

          def sb_get(project_id):
              query = urllib.parse.urlencode({
                  "project_id": f"eq.{project_id}",
                  "select": (
                      "id,project_id,status,inputs_json,"
                      "resume_storage_path,"
                      "dify_resume_upload_id,dify_user,"
                      "workflow_run_id,task_id,"
                      "launch_attempted_at,error_message"
                  ),
              })
              url = f"{SUPABASE_URL}/rest/v1/five_oc_runs?{query}"
              req = urllib.request.Request(
                  url, headers=sb_headers(), method="GET"
              )
              with urllib.request.urlopen(req, timeout=30) as r:
                  data = json.loads(r.read().decode())
              if not isinstance(data, list) or len(data) != 1:
                  raise RuntimeError(
                      "Expected exactly one durable run record."
                  )
              return data[0]

          def sb_patch(run_id, payload):
              query = urllib.parse.urlencode({"id": f"eq.{run_id}"})
              url = f"{SUPABASE_URL}/rest/v1/five_oc_runs?{query}"
              req = urllib.request.Request(
                  url,
                  data=json.dumps(payload).encode(),
                  headers=sb_headers({
                      "Prefer": "return=representation"
                  }),
                  method="PATCH",
              )
              with urllib.request.urlopen(req, timeout=30) as r:
                  data = json.loads(r.read().decode())
              if not isinstance(data, list) or len(data) != 1:
                  raise RuntimeError(
                      "Supabase update did not return exactly one record."
                  )
              return data[0]

