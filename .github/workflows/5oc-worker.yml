name: 5OC Worker

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  persist-dify-upload-test:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Verify worker configuration
        env:
          DIFY_5OC_API_KEY: ${{ secrets.DIFY_5OC_API_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
        run: |
          set -euo pipefail

          echo "Checking 5OC worker configuration..."

          for NAME in DIFY_5OC_API_KEY SUPABASE_URL SUPABASE_SECRET_KEY
          do
            if [ -z "${!NAME}" ]; then
              echo "::error::${NAME} is missing."
              exit 1
            fi
          done

          echo "Worker configuration verified."

      - name: Read and validate durable run record
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
        run: |
          set -euo pipefail

          PROJECT_ID="GI-WEBSITE-STORAGE-TEST-002"

          HTTP_CODE=$(curl --silent --show-error \
            --output /tmp/5oc-run.json \
            --write-out "%{http_code}" \
            --get \
            "${SUPABASE_URL}/rest/v1/five_oc_runs" \
            --data-urlencode "project_id=eq.${PROJECT_ID}" \
            --data-urlencode "select=id,project_id,status,resume_storage_path,inputs_json,workflow_run_id,task_id,dify_user,launch_attempted_at,dify_resume_upload_id" \
            --header "apikey: ${SUPABASE_SECRET_KEY}" \
            --header "Authorization: Bearer ${SUPABASE_SECRET_KEY}" \
            --header "Accept: application/json")

          echo "Supabase HTTP status: ${HTTP_CODE}"

          if [ "${HTTP_CODE}" != "200" ]; then
            echo "::error::Could not retrieve durable run record."
            exit 1
          fi

          python3 - <<'PY'
          import json
          import os

          with open("/tmp/5oc-run.json", "r") as f:
              data = json.load(f)

          if not isinstance(data, list) or len(data) != 1:
              raise SystemExit(
                  "Expected exactly one durable run record."
              )

          row = data[0]

          if row.get("id") != 2:
              raise SystemExit(
                  f"Expected record ID 2; received {row.get('id')}."
              )

          if row.get("project_id") != "GI-WEBSITE-STORAGE-TEST-002":
              raise SystemExit("Unexpected project_id.")

          if row.get("status") != "created":
              raise SystemExit(
                  f"Expected status created; received {row.get('status')}."
              )

          if row.get("workflow_run_id") is not None:
              raise SystemExit(
                  "workflow_run_id must still be null."
              )

          if row.get("task_id") is not None:
              raise SystemExit(
                  "task_id must still be null."
              )

          if row.get("launch_attempted_at") is not None:
              raise SystemExit(
                  "launch_attempted_at must still be null."
              )

          # This test must begin without a persisted Dify upload.
          if row.get("dify_resume_upload_id") is not None:
              raise SystemExit(
                  "dify_resume_upload_id is already populated. "
                  "Do not create another Dify upload."
              )

          inputs = row.get("inputs_json") or {}
          resume = inputs.get("resume") or {}

          storage_path = row.get("resume_storage_path")
          expected_size = resume.get("size")
          original_name = resume.get("original_name")
          content_type = (
              resume.get("content_type")
              or "application/octet-stream"
          )

          if not storage_path:
              raise SystemExit(
                  "Résumé storage path is missing."
              )

          if not isinstance(expected_size, int) or expected_size <= 0:
              raise SystemExit(
                  "Invalid résumé size metadata."
              )

          if not original_name:
              raise SystemExit(
                  "Original résumé filename is missing."
              )

          with open(os.environ["GITHUB_ENV"], "a") as env:
              env.write("RUN_ID=2\n")
              env.write(
                  "PROJECT_ID=GI-WEBSITE-STORAGE-TEST-002\n"
              )
              env.write(
                  f"RESUME_STORAGE_PATH={storage_path}\n"
              )
              env.write(
                  f"EXPECTED_RESUME_SIZE={expected_size}\n"
              )
              env.write(
                  f"RESUME_ORIGINAL_NAME={original_name}\n"
              )
              env.write(
                  f"RESUME_CONTENT_TYPE={content_type}\n"
              )

          print(f"Record ID: {row.get('id')}")
          print(f"Project ID: {row.get('project_id')}")
          print(f"Status: {row.get('status')}")
          print("Durable record is safe for upload test.")
          PY

      - name: Retrieve private resume
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
        run: |
          set -euo pipefail

          HTTP_CODE=$(curl --silent --show-error \
            --output /tmp/5oc-resume.bin \
            --write-out "%{http_code}" \
            "${SUPABASE_URL}/storage/v1/object/authenticated/five-oc-inputs/${RESUME_STORAGE_PATH}" \
            --header "apikey: ${SUPABASE_SECRET_KEY}" \
            --header "Authorization: Bearer ${SUPABASE_SECRET_KEY}")

          echo "Storage HTTP status: ${HTTP_CODE}"

          if [ "${HTTP_CODE}" != "200" ]; then
            echo "::error::Private résumé retrieval failed."
            exit 1
          fi

          ACTUAL_SIZE=$(wc -c < /tmp/5oc-resume.bin)
          ACTUAL_SIZE=$(echo "${ACTUAL_SIZE}" | tr -d ' ')

          echo "Expected résumé bytes: ${EXPECTED_RESUME_SIZE}"
          echo "Downloaded résumé bytes: ${ACTUAL_SIZE}"

          if [ "${ACTUAL_SIZE}" != "${EXPECTED_RESUME_SIZE}" ]; then
            echo "::error::Résumé integrity check failed."
            exit 1
          fi

          echo "Private résumé retrieval: PASSED"

      - name: Upload resume to Dify
        env:
          DIFY_5OC_API_KEY: ${{ secrets.DIFY_5OC_API_KEY }}
        run: |
          set -euo pipefail

          echo "Uploading résumé to Dify..."
          echo "/workflows/run will NOT be called."

          HTTP_CODE=$(curl --silent --show-error \
            --output /tmp/dify-upload.json \
            --write-out "%{http_code}" \
            --request POST \
            "https://api.dify.ai/v1/files/upload" \
            --header "Authorization: Bearer ${DIFY_5OC_API_KEY}" \
            --form "file=@/tmp/5oc-resume.bin;filename=${RESUME_ORIGINAL_NAME};type=${RESUME_CONTENT_TYPE}" \
            --form "user=github-5oc-worker")

          echo "Dify upload HTTP status: ${HTTP_CODE}"

          if [ "${HTTP_CODE}" != "200" ] && \
             [ "${HTTP_CODE}" != "201" ]; then
            echo "::error::Dify résumé upload failed."
            exit 1
          fi

          python3 - <<'PY'
          import json
          import os

          with open("/tmp/dify-upload.json", "r") as f:
              data = json.load(f)

          upload_id = data.get("id")

          if not upload_id:
              raise SystemExit(
                  "Dify returned no upload file ID."
              )

          with open(os.environ["GITHUB_ENV"], "a") as env:
              env.write(
                  f"DIFY_RESUME_UPLOAD_ID={upload_id}\n"
              )

          print("Dify résumé upload: PASSED")
          print("Dify upload file ID received.")
          print("/workflows/run called: NO")
          PY

      - name: Persist Dify upload ID
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
        run: |
          set -euo pipefail

          python3 - <<'PY'
          import json
          import os

          payload = {
              "dify_resume_upload_id":
                  os.environ["DIFY_RESUME_UPLOAD_ID"],
              "dify_user":
                  "github-5oc-worker",
              "updated_at":
                  __import__("datetime")
                  .datetime.now(
                      __import__("datetime").timezone.utc
                  )
                  .isoformat(),
          }

          with open("/tmp/update.json", "w") as f:
              json.dump(payload, f)
          PY

          HTTP_CODE=$(curl --silent --show-error \
            --output /tmp/update-response.json \
            --write-out "%{http_code}" \
            --request PATCH \
            "${SUPABASE_URL}/rest/v1/five_oc_runs?id=eq.${RUN_ID}&project_id=eq.${PROJECT_ID}" \
            --header "apikey: ${SUPABASE_SECRET_KEY}" \
            --header "Authorization: Bearer ${SUPABASE_SECRET_KEY}" \
            --header "Content-Type: application/json" \
            --header "Prefer: return=representation" \
            --data-binary @/tmp/update.json)

          echo "Supabase update HTTP status: ${HTTP_CODE}"

          if [ "${HTTP_CODE}" != "200" ]; then
            echo "::error::Could not persist Dify upload ID."
            exit 1
          fi

          python3 - <<'PY'
          import json
          import os

          with open("/tmp/update-response.json", "r") as f:
              data = json.load(f)

          if not isinstance(data, list) or len(data) != 1:
              raise SystemExit(
                  "Expected exactly one updated record."
              )

          row = data[0]

          expected = os.environ["DIFY_RESUME_UPLOAD_ID"]

          if row.get("dify_resume_upload_id") != expected:
              raise SystemExit(
                  "Persisted Dify upload ID does not match."
              )

          if row.get("dify_user") != "github-5oc-worker":
              raise SystemExit(
                  "Persisted Dify user does not match."
              )

          print("Dify upload ID persisted: PASSED")
          print("Dify user persisted: github-5oc-worker")
          PY

      - name: Verify recovery checkpoint
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
        run: |
          set -euo pipefail

          HTTP_CODE=$(curl --silent --show-error \
            --output /tmp/checkpoint.json \
            --write-out "%{http_code}" \
            --get \
            "${SUPABASE_URL}/rest/v1/five_oc_runs" \
            --data-urlencode "id=eq.${RUN_ID}" \
            --data-urlencode "project_id=eq.${PROJECT_ID}" \
            --data-urlencode "select=id,project_id,status,dify_resume_upload_id,dify_user,workflow_run_id,task_id,launch_attempted_at" \
            --header "apikey: ${SUPABASE_SECRET_KEY}" \
            --header "Authorization: Bearer ${SUPABASE_SECRET_KEY}" \
            --header "Accept: application/json")

          if [ "${HTTP_CODE}" != "200" ]; then
            echo "::error::Recovery checkpoint read failed."
            exit 1
          fi

          python3 - <<'PY'
          import json
          import os

          with open("/tmp/checkpoint.json", "r") as f:
              data = json.load(f)

          if not isinstance(data, list) or len(data) != 1:
              raise SystemExit(
                  "Recovery checkpoint record missing."
              )

          row = data[0]

          if row.get("dify_resume_upload_id") != \
                  os.environ["DIFY_RESUME_UPLOAD_ID"]:
              raise SystemExit(
                  "Recovery checkpoint upload ID mismatch."
              )

          if row.get("workflow_run_id") is not None:
              raise SystemExit(
                  "workflow_run_id unexpectedly populated."
              )

          if row.get("task_id") is not None:
              raise SystemExit(
                  "task_id unexpectedly populated."
              )

          if row.get("launch_attempted_at") is not None:
              raise SystemExit(
                  "launch_attempted_at unexpectedly populated."
              )

          print("========================================")
          print("5OC PRE-LAUNCH CHECKPOINT: PASSED")
          print("========================================")
          print("Private résumé retrieval: PASSED")
          print("Dify résumé upload: PASSED")
          print("Dify upload ID persisted: PASSED")
          print("Dify user persisted: PASSED")
          print("Workflow run ID: NULL")
          print("Task ID: NULL")
          print("Launch attempted: NO")
          print("/workflows/run called: NO")
          print("5OC workflow execution: NOT STARTED")
          print("========================================")
          PY
