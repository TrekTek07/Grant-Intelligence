name: 5OC Worker

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  supabase-connection-test:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Verify worker configuration
        env:
          DIFY_5OC_API_KEY: ${{ secrets.DIFY_5OC_API_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
        run: |
          echo "Checking 5OC worker configuration..."

          if [ -z "$DIFY_5OC_API_KEY" ]; then
            echo "::error::DIFY_5OC_API_KEY is missing."
            exit 1
          fi

          if [ -z "$SUPABASE_URL" ]; then
            echo "::error::SUPABASE_URL is missing."
            exit 1
          fi

          if [ -z "$SUPABASE_SECRET_KEY" ]; then
            echo "::error::SUPABASE_SECRET_KEY is missing."
            exit 1
          fi

          echo "Worker secrets are configured."

      - name: Read protected 5OC test record from Supabase
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
        run: |
          set -euo pipefail

          PROJECT_ID="GI-DATABASE-SAFETY-TEST-001"

          echo "Reading existing 5OC safety-test record..."
          echo "Dify will NOT be contacted."

          HTTP_CODE=$(curl --silent --show-error \
            --output /tmp/5oc-response.json \
            --write-out "%{http_code}" \
            --get \
            "${SUPABASE_URL}/rest/v1/five_oc_runs" \
            --data-urlencode "project_id=eq.${PROJECT_ID}" \
            --data-urlencode "select=id,project_id,status,workflow_run_id,task_id,dify_user,launch_attempted_at,created_at,updated_at" \
            --header "apikey: ${SUPABASE_SECRET_KEY}" \
            --header "Authorization: Bearer ${SUPABASE_SECRET_KEY}" \
            --header "Accept: application/json")

          echo "Supabase HTTP status: ${HTTP_CODE}"

          if [ "${HTTP_CODE}" != "200" ]; then
            echo "::error::Supabase request failed."
            cat /tmp/5oc-response.json
            exit 1
          fi

          RECORD_COUNT=$(python3 - <<'PY'
          import json

          with open("/tmp/5oc-response.json", "r") as f:
              data = json.load(f)

          if not isinstance(data, list):
              raise SystemExit("Supabase did not return a JSON array.")

          print(len(data))
          PY
          )

          if [ "${RECORD_COUNT}" != "1" ]; then
            echo "::error::Expected exactly one protected test record; found ${RECORD_COUNT}."
            exit 1
          fi

          python3 - <<'PY'
          import json

          with open("/tmp/5oc-response.json", "r") as f:
              data = json.load(f)

          row = data[0]

          if row.get("project_id") != "GI-DATABASE-SAFETY-TEST-001":
              raise SystemExit("Unexpected project_id returned.")

          if row.get("status") != "created":
              raise SystemExit(
                  f"Unexpected test status: {row.get('status')}"
              )

          if row.get("workflow_run_id") is not None:
              raise SystemExit(
                  "Safety-test record unexpectedly contains a workflow_run_id."
              )

          if row.get("launch_attempted_at") is not None:
              raise SystemExit(
                  "Safety-test record unexpectedly shows a Dify launch attempt."
              )

          print(f"Record ID: {row.get('id')}")
          print(f"Project ID: {row.get('project_id')}")
          print(f"Status: {row.get('status')}")
          print("Protected Supabase record retrieved successfully.")
          print("No Dify request was made.")
          PY
