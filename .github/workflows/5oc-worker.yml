name: 5OC POST Boundary Diagnostic

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-post-boundary:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Test Dify POST boundary without valid 5OC inputs
        env:
          DIFY_5OC_API_KEY: ${{ secrets.DIFY_5OC_API_KEY }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import sys
          import urllib.request
          import urllib.error

          API_KEY = os.environ.get("DIFY_5OC_API_KEY", "")
          URL = "https://api.dify.ai/v1/workflows/run"

          if not API_KEY:
              raise RuntimeError(
                  "DIFY_5OC_API_KEY is missing."
              )

          print("========================================")
          print("5OC POST BOUNDARY DIAGNOSTIC")
          print("========================================")
          print("Purpose:")
          print(
              "Test whether POST /workflows/run reaches "
              "Dify instead of being blocked by Cloudflare."
          )
          print()
          print("VALID 5OC INPUT PACKAGE: NOT PROVIDED")
          print("Required access_mode: OMITTED")
          print("Required source_mode: OMITTED")
          print("Résumé upload ID: NOT PROVIDED")
          print("Project ID: NOT PROVIDED")
          print("Supabase writes: DISABLED")
          print("Automatic retry: DISABLED")
          print("----------------------------------------")

          # Intentionally invalid workflow request.
          #
          # The published Main schema requires:
          #   access_mode
          #   source_mode
          #
          # Both are deliberately omitted.
          #
          # This is intended to make Dify reject the request
          # during input validation rather than execute 5OC.

          payload = {
              "inputs": {},
              "response_mode": "streaming",
              "user": "github-5oc-boundary-diagnostic",
          }

          encoded_payload = json.dumps(payload).encode("utf-8")

          request = urllib.request.Request(
              URL,
              data=encoded_payload,
              headers={
                  "Authorization": f"Bearer {API_KEY}",
                  "Content-Type": "application/json",
                  "Accept": "text/event-stream",
                  "User-Agent":
                      "Grant-Intelligence-5OC-Diagnostic/1.0",
              },
              method="POST",
          )

          print("Sending intentionally invalid POST...")
          print(
              "User-Agent: "
              "Grant-Intelligence-5OC-Diagnostic/1.0"
          )
          print()

          try:
              with urllib.request.urlopen(
                  request,
                  timeout=30
              ) as response:

                  body = response.read(3000).decode(
                      "utf-8",
                      errors="replace"
                  )

                  print("========================================")
                  print("UNEXPECTED SUCCESS RESPONSE")
                  print("========================================")
                  print(
                      f"HTTP STATUS: {response.status}"
                  )
                  print(
                      "CONTENT-TYPE:",
                      response.headers.get(
                          "Content-Type",
                          "unknown"
                      )
                  )
                  print(
                      "SERVER:",
                      response.headers.get(
                          "Server",
                          "unknown"
                      )
                  )

                  cf_ray = response.headers.get("CF-RAY")

                  if cf_ray:
                      print(f"CF-RAY: {cf_ray}")

                  print()
                  print("BODY PREVIEW:")
                  print(body[:2000])

                  print()
                  print(
                      "WARNING: Dify accepted the intentionally "
                      "invalid request."
                  )
                  print(
                      "Do NOT repeat this diagnostic."
                  )

                  # Fail the GitHub job deliberately so an
                  # unexpected acceptance is impossible to
                  # mistake for a successful safety test.
                  sys.exit(2)

          except urllib.error.HTTPError as e:

              body = e.read(3000).decode(
                  "utf-8",
                  errors="replace"
              )

              content_type = e.headers.get(
                  "Content-Type",
                  "unknown"
              )

              server = e.headers.get(
                  "Server",
                  "unknown"
              )

              cf_ray = e.headers.get("CF-RAY")

              print("========================================")
              print("POST REJECTION RECEIVED")
              print("========================================")
              print(f"HTTP STATUS: {e.code}")
              print(f"CONTENT-TYPE: {content_type}")
              print(f"SERVER: {server}")

              if cf_ray:
                  print(f"CF-RAY: {cf_ray}")

              lower_body = body.lower()

              cloudflare_html = (
                  "access denied" in lower_body
                  or
                  "<!doctype html" in lower_body
                  or
                  "cloudflare" in lower_body
              )

              print()
              print(
                  "CLOUDFLARE HTML ACCESS PAGE:",
                  "YES" if cloudflare_html else "NO"
              )

              print()
              print("BODY PREVIEW:")
              print(body[:2000])

              print()
              print("========================================")

              if cloudflare_html:
                  print(
                      "RESULT: POST WAS BLOCKED AT "
                      "CLOUDFLARE BOUNDARY"
                  )
                  print(
                      "The request did not produce a normal "
                      "Dify API validation response."
                  )
              else:
                  print(
                      "RESULT: POST REACHED THE DIFY "
                      "APPLICATION/API LAYER"
                  )
                  print(
                      "Dify rejected the intentionally invalid "
                      "request rather than Cloudflare blocking it."
                  )

              print("========================================")
              print("Valid 5OC inputs supplied: NO")
              print("Résumé supplied: NO")
              print("Supabase modified: NO")
              print("Automatic retry performed: NO")
              print("========================================")

              # A rejection is the expected diagnostic outcome.
              sys.exit(0)

          except Exception as e:
              print("========================================")
              print("CONNECTION/CLIENT FAILURE")
              print("========================================")
              print(
                  f"{type(e).__name__}: {str(e)}"
              )
              print()
              print("Do NOT repeat the diagnostic.")
              sys.exit(1)
          PY
