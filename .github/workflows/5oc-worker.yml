name: 5OC Worker

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dify-file-upload-test:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Verify worker configuration
        env:
          DIFY_5OC_API_KEY: ${{ secrets.DIFY_5OC_API_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
        run: |
          set -euo pipefail

          echo "Checking 5OC worker configuration..."

          for NAME in DIFY_5OC_API_KEY SUPABASE_URL SUPABASE_SECRET_KEY
          do
            if [ -z "${!NAME}" ]; then
              echo "::error::${NAME} is missing."
              exit 1
            fi
          done

          echo "Worker configuration verified."

      - name: Read durable run record
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
        run: |
          set -euo pipefail

          PROJECT_ID="GI-WEBSITE-STORAGE-TEST-002"

          HTTP_CODE=$(curl --silent --show-error \
            --output /tmp/5oc-run.json \
            --write-out "%{http_code}" \
            --get \
            "${SUPABASE_URL}/rest/v1/five_oc_runs" \
            --data-urlencode "project_id=eq.${PROJECT_ID}" \
            --data-urlencode "select=id,project_id,status,resume_storage_path,inputs_json,workflow_run_id,task_id,launch_attempted_at" \
            --header "apikey: ${SUPABASE_SECRET_KEY}" \
            --header "Authorization: Bearer ${SUPABASE_SECRET_KEY}" \
            --header "Accept: application/json")

          echo "Supabase HTTP status: ${HTTP_CODE}"

          if [ "${HTTP_CODE}" != "200" ]; then
            echo "::error::Could not retrieve the durable run record."
            exit 1
          fi

          python3 - <<'PY'
          import json
          import os

          with open("/tmp/5oc-run.json", "r") as f:
              data = json.load(f)

          if not isinstance(data, list) or len(data) != 1:
              raise SystemExit("Expected exactly one run record.")

          row = data[0]

          if row.get("id") != 2:
              raise SystemExit(
                  f"Expected record ID 2; received {row.get('id')}."
              )

          if row.get("status") != "created":
              raise SystemExit(
                  f"Expected status created; received {row.get('status')}."
              )

          if row.get("workflow_run_id") is not None:
              raise SystemExit(
                  "This test record already has a workflow_run_id."
              )

          if row.get("task_id") is not None:
              raise SystemExit(
                  "This test record already has a task_id."
              )

          if row.get("launch_attempted_at") is not None:
              raise SystemExit(
                  "This test record already shows a workflow launch attempt."
              )

          inputs = row.get("inputs_json") or {}
          resume = inputs.get("resume") or {}

          storage_path = row.get("resume_storage_path")
          expected_size = resume.get("size")
          original_name = resume.get("original_name")
          content_type = resume.get("content_type")

          if not storage_path:
              raise SystemExit("Résumé storage path is missing.")

          if not isinstance(expected_size, int) or expected_size <= 0:
              raise SystemExit("Invalid résumé size metadata.")

          if not original_name:
              raise SystemExit("Original résumé filename is missing.")

          if not content_type:
              content_type = "application/octet-stream"

          with open(os.environ["GITHUB_ENV"], "a") as env:
              env.write(f"RESUME_STORAGE_PATH={storage_path}\n")
              env.write(f"EXPECTED_RESUME_SIZE={expected_size}\n")
              env.write(f"RESUME_ORIGINAL_NAME={original_name}\n")
              env.write(f"RESUME_CONTENT_TYPE={content_type}\n")

          print(f"Record ID: {row.get('id')}")
          print(f"Project ID: {row.get('project_id')}")
          print(f"Status: {row.get('status')}")
          print(f"Expected résumé bytes: {expected_size}")
          print("Run record verified.")
          PY

      - name: Retrieve private resume
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
        run: |
          set -euo pipefail

          HTTP_CODE=$(curl --silent --show-error \
            --output /tmp/5oc-resume.bin \
            --write-out "%{http_code}" \
            "${SUPABASE_URL}/storage/v1/object/authenticated/five-oc-inputs/${RESUME_STORAGE_PATH}" \
            --header "apikey: ${SUPABASE_SECRET_KEY}" \
            --header "Authorization: Bearer ${SUPABASE_SECRET_KEY}")

          echo "Storage HTTP status: ${HTTP_CODE}"

          if [ "${HTTP_CODE}" != "200" ]; then
            echo "::error::Private résumé retrieval failed."
            exit 1
          fi

          ACTUAL_SIZE=$(wc -c < /tmp/5oc-resume.bin)
          ACTUAL_SIZE=$(echo "${ACTUAL_SIZE}" | tr -d ' ')

          echo "Expected résumé bytes: ${EXPECTED_RESUME_SIZE}"
          echo "Downloaded résumé bytes: ${ACTUAL_SIZE}"

          if [ "${ACTUAL_SIZE}" != "${EXPECTED_RESUME_SIZE}" ]; then
            echo "::error::Résumé byte count does not match."
            exit 1
          fi

          echo "Private résumé retrieval verified."

      - name: Upload resume to Dify only
        env:
          DIFY_5OC_API_KEY: ${{ secrets.DIFY_5OC_API_KEY }}
        run: |
          set -euo pipefail

          echo "Uploading résumé to Dify..."
          echo "IMPORTANT: /workflows/run will NOT be called."

          HTTP_CODE=$(curl --silent --show-error \
            --output /tmp/dify-upload.json \
            --write-out "%{http_code}" \
            --request POST \
            "https://api.dify.ai/v1/files/upload" \
            --header "Authorization: Bearer ${DIFY_5OC_API_KEY}" \
            --form "file=@/tmp/5oc-resume.bin;filename=${RESUME_ORIGINAL_NAME};type=${RESUME_CONTENT_TYPE}" \
            --form "user=github-5oc-worker")

          echo "Dify upload HTTP status: ${HTTP_CODE}"

          if [ "${HTTP_CODE}" != "200" ] && \
             [ "${HTTP_CODE}" != "201" ]; then
            echo "::error::Dify file upload failed."

            python3 - <<'PY'
          import json

          try:
              with open("/tmp/dify-upload.json", "r") as f:
                  data = json.load(f)

              safe = {
                  "code": data.get("code"),
                  "message": data.get("message"),
                  "status": data.get("status"),
              }

              print(json.dumps(safe, indent=2))
          except Exception:
              print("Dify returned a non-JSON error response.")
          PY

            exit 1
          fi

          python3 - <<'PY'
          import json

          with open("/tmp/dify-upload.json", "r") as f:
              data = json.load(f)

          upload_id = data.get("id")

          if not upload_id:
              raise SystemExit(
                  "Dify upload succeeded but no upload file ID was returned."
              )

          print("Dify résumé upload: PASSED")
          print(f"Upload file ID: {upload_id}")
          print("5OC workflow started: NO")
          print("/workflows/run called: NO")
          PY

      - name: Confirm controlled test
        run: |
          echo "========================================"
          echo "5OC DIFY FILE HANDOFF TEST COMPLETE"
          echo "========================================"
          echo "Supabase DB read: PASSED"
          echo "Private résumé retrieval: PASSED"
          echo "Dify file upload: attempted"
          echo "Dify /workflows/run: NOT CALLED"
          echo "5OC workflow execution: NOT STARTED"
          echo "========================================"
