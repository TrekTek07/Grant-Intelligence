<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="description" content="Grant Intelligence secure email verification return page.">
<title>Verifying Account — Grant Intelligence™</title>
<style>
body{margin:0;min-height:100vh;display:grid;place-items:center;background:#07111f;color:#f5f8fb;font-family:Inter,system-ui,sans-serif}
.card{width:min(600px,90vw);border:1px solid rgba(255,255,255,.12);background:#0f2035;border-radius:22px;padding:30px;text-align:center}
.spin{width:42px;height:42px;margin:0 auto 18px;border-radius:50%;border:4px solid rgba(255,255,255,.12);border-top-color:#34d5ff;animation:s 1s linear infinite}
@keyframes s{to{transform:rotate(360deg)}}p{color:#a8b7c8;line-height:1.6}.safe{margin-top:18px;color:#9fe9c1;font-size:.9rem}
</style>
</head>
<body>
<div class="card">
  <div class="spin"></div>
  <h1>Verifying your Grant Intelligence account…</h1>
  <p id="status">Please wait while Supabase confirms your secure email session.</p>
  <div class="safe">Grant Intelligence does not request third-party passwords on this page.</div>
</div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase-config.js"></script>
<script src="auth-callback.js"></script>
</body>
</html>
